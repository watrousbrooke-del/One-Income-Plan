<!--
  ============================================================
  THE ONE INCOME PLAN  ·  SITE-WIDE HEAD CODE
  Paste into Showit: Site Settings > Integrations > Add Custom Code
  (placement: head, all pages).

  1. SHARE IMAGE. The og:image and twitter:image tags give every page
     a branded preview when it is shared on Pinterest, Facebook or in
     a text. Swap the URL if the image changes.

  2. COOKIE BANNER + ANALYTICS. Nothing that tracks visitors loads
     until the visitor says yes. Paste the IDs below and they start
     working on their own, for everyone who accepted.
       ga4           Google Analytics 4 Measurement ID, G-XXXXXXXXXX
       metaPixel     Meta (Facebook) Pixel ID, numbers only
       pinterestTag  Pinterest Tag ID, numbers only
     Do NOT also enter the GA ID in Showit's own Google Analytics
     field, or it will load without consent.

  The choice is remembered in this browser. ppCookieSettings() reopens
  the banner, and any link with class "js-cookie-settings" does too.
  Zero em dashes, zero en dashes.
  ============================================================
-->
<meta property="og:image" content="https://raw.githubusercontent.com/genasbury12/blb-site/claude/brookes-images-folder-sf3xp4/brooke-site-images/pp-share-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://raw.githubusercontent.com/genasbury12/blb-site/claude/brookes-images-folder-sf3xp4/brooke-site-images/pp-share-image.jpg">
<style>
  .pp-cookie { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 2147483000; max-width: 560px; margin: 0 auto; background: #2E3E2F; color: #FBF4D7; border-radius: 16px; padding: 1.1rem 1.2rem; box-shadow: 0 18px 50px rgba(0,0,0,0.28); font-family: Georgia, 'Times New Roman', serif; font-size: 15px; line-height: 1.5; display: none; }
  .pp-cookie.show { display: block; animation: ppCookieIn 0.35s ease both; }
  @keyframes ppCookieIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .pp-cookie p { margin: 0 0 0.85rem; color: #FBF4D7; }
  .pp-cookie a { color: #F7D0BE !important; text-decoration: underline; }
  .pp-cookie-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .pp-cookie button { font-family: Georgia, serif; font-size: 14px; font-weight: bold; border-radius: 999px; padding: 0.6rem 1.15rem; cursor: pointer; border: 2px solid transparent; }
  .pp-cookie .pp-yes { background: #DD6B4E; color: #fff; border-color: #DD6B4E; box-shadow: 0 2px 0 #C25441; }
  .pp-cookie .pp-no { background: transparent; color: #FBF4D7; border-color: rgba(247,208,190,0.6); }
  @media print { .pp-cookie { display: none !important; } }
</style>
<script>
(function () {
  var PP_TRACKING = {
    ga4: '',
    metaPixel: '',
    pinterestTag: ''
  };
  var KEY = 'ppConsent';

  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

  function loadTracking() {
    if (window.__ppTrackingLoaded) return;
    window.__ppTrackingLoaded = true;
    if (PP_TRACKING.ga4) {
      var s = document.createElement('script'); s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(PP_TRACKING.ga4);
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', PP_TRACKING.ga4, { anonymize_ip: true });
    }
    if (PP_TRACKING.metaPixel) {
      !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', PP_TRACKING.metaPixel); window.fbq('track', 'PageView');
    }
    if (PP_TRACKING.pinterestTag) {
      !function (e) { if (!window.pintrk) { window.pintrk = function () { window.pintrk.queue.push(Array.prototype.slice.call(arguments)); }; var n = window.pintrk; n.queue = []; n.version = '3.0'; var t = document.createElement('script'); t.async = !0; t.src = e; var r = document.getElementsByTagName('script')[0]; r.parentNode.insertBefore(t, r); } }('https://s.pinimg.com/ct/core.js');
      window.pintrk('load', PP_TRACKING.pinterestTag); window.pintrk('page');
    }
  }

  function banner() {
    var el = document.getElementById('ppCookie');
    if (el) { el.classList.add('show'); return; }
    el = document.createElement('div');
    el.id = 'ppCookie'; el.className = 'pp-cookie';
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Cookie choices');
    el.innerHTML = '<p>I use a few cookies to see which pages actually help and to reach more one-income families online. Nothing about you is ever sold. Is that okay? <a href="/privacy-policy">Privacy policy</a></p>' +
      '<div class="pp-cookie-row"><button type="button" class="pp-yes">That is fine</button><button type="button" class="pp-no">Only the essentials</button></div>';
    document.body.appendChild(el);
    el.querySelector('.pp-yes').addEventListener('click', function () { set('all'); el.classList.remove('show'); loadTracking(); });
    el.querySelector('.pp-no').addEventListener('click', function () { set('essential'); el.classList.remove('show'); });
    requestAnimationFrame(function () { el.classList.add('show'); });
  }

  window.ppCookieSettings = banner;
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('.js-cookie-settings') : null;
    if (t) { e.preventDefault(); banner(); }
  });

  function start() {
    var c = get();
    if (c === 'all') loadTracking();
    else if (!c) banner();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
